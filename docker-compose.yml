# docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────
# Local development stack — runs everything with one command:
#    docker compose up
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. Kaggle ingest ───────────────────────────────────────────────────────
  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    container_name: weather_ingest
    volumes:
      - ./data:/project/data          # writes to data/raw/
    environment:
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
    restart: "no"

  # ── 2. R transform (DuckDB build + model training) ─────────────────────────
  transform:
    build:
      context: .
      file: transform/Dockerfile
    container_name: weather_transform
    volumes:
      # Mount the whole project root so relative paths (../data) work identically 
      # inside both the docker container and your local machine setup
      - .:/project
    depends_on:
      ingest:
        condition: service_completed_successfully
    restart: "no"

  # ── 3. Shiny dashboard ─────────────────────────────────────────────────────
  shiny:
    build:
      context: ./shiny_app
      dockerfile: Dockerfile
    container_name: weather_shiny
    ports:
      - "3838:3838"
    volumes:
      - ./shiny_app/app.R:/srv/shiny-server/weatherapp/app.R
      - ./data/curated:/srv/shiny-server/weatherapp/data/curated
      - ./shiny_app/www:/srv/shiny-server/weatherapp/www
    # CHANGED: Allow app to start anytime if the DB already exists locally
    depends_on:
      transform:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── 4. MLflow UI (Fixed path syncing) ──────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.3.2
    container_name: weather_mlflow
    ports:
      - "5000:5000"
    volumes:
      # Sync the volume path perfectly with where your R container writes it
      - ./mlflow_tracking:/project/mlflow_tracking
    command: >
      mlflow server
        --backend-store-uri /project/mlflow_tracking
        --default-artifact-root /project/mlflow_tracking/artifacts
        --host 0.0.0.0
        --port 5000
    restart: unless-stopped
    restart: unless-stopped
