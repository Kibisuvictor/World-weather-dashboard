# .github/workflows/ingest.yml
# ─────────────────────────────────────────────────────────────────────────────
# Schedule:  daily at 06:00 UTC
# Steps:
#   1. Pull fresh data from Kaggle (Python + Docker)
#   2. Build DuckDB & Train ML model sequentially inside a single Docker container
#   3. Commit updated curated/ back to the repo
# ─────────────────────────────────────────────────────────────────────────────

name: Ingest → Transform → Train

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch:       # manual trigger from GitHub UI

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Drastically reduced from 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git push later

      # ── 2. Create data directories ───────────────────────────────────────
      - name: Create data directories
        run: mkdir -p data/raw data/staging data/curated mlflow_tracking

      # ── 3. Set up Docker Buildx for ultra-fast layer caching ─────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Kaggle ingest (Dockerised Python) ────────────────────────────
      - name: Build ingest image
        uses: docker/build-push-action@v5
        with:
          context: ./ingest
          tags: weather-ingest:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run ingest container
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:      ${{ secrets.KAGGLE_KEY }}
        run: |
          docker run --rm \
            -e KAGGLE_USERNAME="${KAGGLE_USERNAME}" \
            -e KAGGLE_KEY="${KAGGLE_KEY}" \
            -v "${{ github.workspace }}/data:/project/data" \
            weather-ingest:latest

      # ── 5. Build and Cache Transform/Train Docker Image ──────────────────
      - name: Build transform & train image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: transform/Dockerfile
          tags: weather-transform:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 6. Run Transform & Train Inside Docker ────────────────────────────
      # We mount both the data directory and the mlflow directory to persist outputs
      - name: Run Transform & Train pipeline
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/data:/project/data" \
            -v "${{ github.workspace }}/mlflow_tracking:/project/mlflow_tracking" \
            weather-transform:latest

      # ── 7. Upload MLflow artefacts ──────────────────────────────────────
      - name: Upload MLflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: mlflow_tracking/
          retention-days: 30

      # ── 8. Commit updated curated data back to repo ──────────────────────
      - name: Commit curated outputs
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add data/curated/
          # Only commit if something changed
          git diff --staged --quiet || \
            git commit -m "chore: refresh curated data [skip ci] $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
